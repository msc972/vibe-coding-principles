# This repo dogfoods its own template — see pre-commit-config.template.yaml.
# Kept in sync by hand; on template changes, mirror the relevant updates here.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --target-version=py312]
      - id: ruff-format
        args: [--target-version=py312]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--python-version=3.12]
        additional_dependencies: []
        # Tests import pytest (absent from mypy's isolated env) and are loosely
        # typed by design — type-check the shipped code, not the tests.
        exclude: ^tests/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        # Tests use `assert` (B101) as their core mechanism — exclude them.
        exclude: ^tests/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
