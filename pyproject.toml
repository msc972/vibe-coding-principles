[tool.ruff]
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["session_principles_loader"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing trailing commas — known conflict with `ruff format`
    "ISC001",  # implicit string concatenation — known conflict with `ruff format`
    "D203",    # incompatible with D211 (no blank line before class) — we keep D211
    "D213",    # incompatible with D212 (summary on first line) — we keep D212
]

[tool.ruff.lint.per-file-ignores]
# Hook scripts must use print() to write the deny-JSON response on stdout (harness contract).
# Subprocess in pre_commit_guard.py uses a fixed command list, already justified inline (# nosec B603).
# Hook scripts manipulate shell-style paths as strings (not real filesystem
# navigation), so the PTH lints (use Path() instead of os.path) don't apply.
# check_locked_paths in pre_commit_guard.py exceeds C901 due to multiple
# distinct detection branches; splitting would obscure intent.
"ai_edit_guard.py" = ["T201", "PTH111"]
"pre_commit_guard.py" = ["T201", "S603", "PTH111", "PTH119", "C901"]
# session_principles_loader.py writes its JSON payload to stdout via print().
"session_principles_loader.py" = ["T201"]
# Test files: asserts are the point (S101); pytest fixtures and example values
# don't need docstrings/annotations (D, ANN) or named constants (PLR2004); the
# tests/ dir is an implicit namespace package by design (INP001).
"tests/*" = ["S101", "D", "ANN", "PLR2004", "INP001"]

[tool.pytest.ini_options]
# Make the repo root importable so tests can `import session_principles_loader`.
pythonpath = ["."]
testpaths = ["tests"]
# Registering the marker keeps `pytest -m spec` (the commit gate) warning-free.
markers = [
    "spec: executable specification test — inviolable while annotated (see ENGINEERING_PRINCIPLES.md §34)",
]
